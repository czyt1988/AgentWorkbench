site_name: AgentWorkbench
site_description: Agent workbench for AI coding agents - launch, embed and manage their web UIs in one shell. Qt6/QML + C++.
site_url: https://agentlauncher.dev
repo_url: https://github.com/czyt1988/AgentWorkbench
repo_name: czyt1988/AgentWorkbench
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: false
      languages:
        - locale: en
          name: English
          default: true
          build: true
          nav:
            - Home: index.md
            - Guide:
                - Getting started: guide/index.md
                - Agent launcher: guide/agent-launcher.md
                - Web interface: guide/web-ui.md
                - Skills: guide/skills.md
                - Agent Tools: guide/agent-tools.md
                - Appearance: guide/appearance.md
                - Settings: guide/settings.md
                - Plugins: guide/plugins.md
                - Troubleshooting: guide/troubleshooting.md
            - Architecture:
                - Overview: architecture/index.md
                - Layers and dependencies: architecture/layers-and-dependencies.md
                - Frontend design: architecture/frontend-design.md
                - C++ library design: architecture/cpp-design.md
                - Extension points: architecture/extension-points.md
                - State and persistence: architecture/state-and-persistence.md
            - Development:
                - Getting started: development/index.md
                - Agent launcher: development/agent-launcher.md
                - Web tabs: development/web-tabs.md
                - WebEngine adapter: development/webengine-adapter.md
                - Skill browser: development/skill-browser.md
                - Agent Tools: development/agent-tools.md
                - Shell and navigation: development/shell-and-navigation.md
                - Settings: development/settings.md
                - Theme engine: development/theme-engine.md
                - Workbench and pages: development/workbench-and-pages.md
                - Plugin host: development/plugin-host.md
                - Core infrastructure: development/core-infrastructure.md
                - Internationalisation: development/i18n.md
            - Configuration: configuration.md
            - Writing plugins: plugins.md
            - Coding standard: standards/coding-standard.md
            - WebEngine embedding (research): research/webengine-embedding.md
        - locale: zh
          name: 中文
          build: true
          nav:
            - 首页: index.md
            - 博客: blog.md
            - 使用指引:
                - 入门: guide/index.md
                - Agent 启动器: guide/Agent启动器.md
                - 网页界面: guide/网页界面.md
                - 技能: guide/技能.md
                - 提示词编写台: guide/提示词编写台.md
                - 外观: guide/外观.md
                - 设置: guide/设置.md
                - 插件: guide/插件.md
                - 出问题了: guide/问题排查.md
            - 架构:
                - 总览: architecture/index.md
                - 分层与依赖: architecture/分层与依赖.md
                - 前端设计: architecture/前端设计.md
                - C++ 库设计: architecture/C++库设计.md
                - 扩展点: architecture/扩展点.md
                - 数据与状态: architecture/数据与状态.md
            - 开发:
                - 入门: development/index.md
                - Agent 启动器: development/Agent启动器.md
                - Web 标签页: development/Web标签页.md
                - WebEngine 适配层: development/WebEngine适配层.md
                - Skill 浏览: development/Skill浏览.md
                - Agent Tools: development/AgentTools.md
                - 外壳与导航: development/外壳与导航.md
                - 设置: development/设置.md
                - 主题引擎: development/主题引擎.md
                - workbench 与页面: development/workbench与页面.md
                - 插件宿主: development/插件宿主.md
                - core 基础设施: development/core基础设施.md
                - 国际化: development/国际化.md
            - 配置: configuration.md
            - 编写插件: plugins.md
            - 编程规范: standards/coding-standard.md
            - WebEngine 内嵌调研: research/webengine-embedding.md

# Agent-facing instructions, not site pages: docs/AGENTS.md holds the writing
# conventions for this documentation, and docs/zh/AGENTS.md points at it. Both
# are deliberately kept out of the nav.
not_in_nav: |
  /AGENTS.md
  /zh/AGENTS.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables

extra:
  alternate:
    - name: English
      link: /AgentWorkbench/
      lang: en
    - name: 中文
      link: /AgentWorkbench/zh/
      lang: zh
